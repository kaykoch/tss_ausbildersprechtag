<!DOCTYPE html>
<html lang="de">

<head>
  <meta charset="UTF-8">
  <style>
        body {
            font-family: Arial, sans-serif;
            line-height: 1.6;
            color: #333;
        }

        .container {
            max-width: 800px;
            margin: 0 auto;
            padding: 20px;
        }

        .important-box {
            background-color: #fff3cd;
            border-left: 5px solid #ffc107;
            padding: 15px;
            margin: 15px 0;
            border-radius: 4px;
        }
        h2, h3 {
            margin:0px;
        }
        /* Button-Styles analog zur ersten Mail */
        .btn-group {
            margin: 20px 0;
        }

        .btn {
            display: inline-block;
            padding: 10px 15px;
            color: #ffffff !important;
            text-decoration: none;
            border-radius: 5px;
            font-weight: bold;
            margin:5px;
        }
        /* Wichtige Aktion: Bestätigen */
        .btn-alert {
            background-color: #dc3545;
        }

        /* Folge-Aktion: Weitere Azubis */
        .btn-primary {
            background-color: #0056b3;
        }

        .data-box {
            background-color: #f7f7f7;
            padding: 20px;
            border-radius: 5px;
            margin: 20px 0;
            border: 1px solid #dee2e6;
            border-left: 5px solid #6c757d;
            display: grid;
            grid-template-columns: 120px 1fr;
        }

        .data-box p {
            margin: 5px 0;
        }

        .data-box dt {
            font-weight: 600;
            margin: 0;
        }

        .data-box dd {
            margin: 0;
        }
        .footer{
          margin-top: 20px;
          font-style: italic;
          font-size: 0.9rem;
          border-top: 1px solid #0056b3;
        }
  </style>
</head>

<body>
  <div class="container">
  {% block content %}

  {% endblock %}
  </div>
</body>

</html>
